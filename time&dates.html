
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Times and Dates</title>
</head>
<body>

    <h1>JavaScript Times and Dates</h1>

    <h2>1. Current Date and Time</h2>
    <button onclick="showDate()">Show Date and Time</button>
    <p id="date"></p>

    <h2>2. Date Details</h2>
    <button onclick="showDetails()">Show Details</button>
    <p id="details"></p>

    <h2>3. Select Your Date</h2>
    <input type="date" id="myDate">
    <button onclick="selectedDate()">Show Selected Date</button>
    <p id="result"></p>

    <h2>4. Digital Clock</h2>
    <h3 id="clock"></h3>

    <script src="time&dates.js"></script>

</body>
</html>
