<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Loops</h1>
<h2>The While Loop</h2>

<p id="demo"></p>
<p id="show"></p>




<script>
let text = "";

let i = 0;
while (i <= 100) {
  text = text + "The number is " + i + "<br>" ; // The number is 0 <br> The number is 1 <br> The number is 2 <br> The number is 3 <br> The number is 4 <br> The number is 5 <br> The number is 6 <br> The number is 7 <br> The number is 8 <br> The number is 9
  i++; // i++ is same like i  = i + 1 or i += 1 the value is now 1
}
console.log(text); // The value of i is now 100
document.getElementById("demo").innerHTML = text;
document.getElementById("show").innerHTML = "the value of i is " + i; // The value of i is now 100
</script>

</body>
</html>
