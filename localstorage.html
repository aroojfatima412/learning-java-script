
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Local Storage</title>
</head>
<body>

    <h1>JavaScript Local Storage</h1>

    <h2>Save Your Name</h2>

    <input type="text" id="userName" placeholder="Enter your name">

    <br><br>

    <button onclick="saveData()">Save Name</button>

    <button onclick="getData()">Get Name</button>

    <button onclick="removeData()">Remove Name</button>

    <button onclick="clearData()">Clear All Data</button>

    <h3 id="result"></h3>

    <script src="localstorage.js"></script>

</body>
</html>
